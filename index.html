// v1 stored exercises by array index. Convert those logs to stable exercise-name keys so
// changing program order later cannot silently attach history to the wrong movement.
function normalizeLogs(input) {
    const source = input && typeof input === "object" ? input : {};
    const out = {};
    Object.keys(source).forEach((dayKey) => {
        const m = /^w([1-5])d([1-5])$/.exec(dayKey);
        if (!m) {
            out[dayKey] = source[dayKey];
            return;
        }
        const w = Number(m[1]), d = Number(m[2]);
        const dayData = PROGRAM.weeks[String(w)] && PROGRAM.weeks[String(w)].days[String(d)];
        if (!dayData) {
            out[dayKey] = source[dayKey];
            return;
        }
        const oldDay = source[dayKey] || {};
        const newDay = {};
        const aliases = {
            "Bench — back-offs": ["Barbell Bench Press"],
            "Chest-Supported Row (plate-loaded)": ["Chest-Supported DB Row"]
        };
        dayData.exercises.forEach((ex, i) => {
            let existing = oldDay[ex.name] || oldDay[i] || oldDay[String(i)];
            if (!existing && aliases[ex.name]) {
                for (const oldName of aliases[ex.name]) if (oldDay[oldName]) { existing = oldDay[oldName]; break; }
            }
            if (existing) newDay[ex.name] = existing;
        });
        // Preserve unknown string keys in case a future version added metadata.
        Object.keys(oldDay).forEach((k) => {
            if (!/^\d+$/.test(k) && !Object.prototype.hasOwnProperty.call(newDay, k))
                newDay[k] = oldDay[k];
        });
        if (Object.keys(newDay).length)
            out[dayKey] = newDay;
    });
    return out;
}

let audioCtx = null;
function unlockAudio() {
    if (audioCtx)
        return audioCtx;
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC)
            return null;
        audioCtx = new AC();
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(0);
    }
    catch (e) {
        audioCtx = null;
    }
    return audioCtx;
}
// Schedules three tones at a precise future time. Returns oscillators so the
// chime can be cancelled if the timer is paused or dismissed early.
function scheduleChime(delaySec) {
    const ctx = audioCtx;
    if (!ctx)
        return null;
    try {
        if (ctx.state === "suspended")
            ctx.resume();
        const base = ctx.currentTime + Math.max(0, delaySec);
        const nodes = [];
        const tones = [880, 880, 1174.7];
        for (let i = 0; i < tones.length; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = tones[i];
            const t = base + i * 0.26;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.55, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + (i === 2 ? 0.5 : 0.2));
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + (i === 2 ? 0.55 : 0.24));
            nodes.push(osc);
        }
        return nodes;
    }
    catch (e) {
        return null;
    }
}
function cancelChime(nodes) {
    if (!nodes)
        return;
    nodes.forEach((n) => { try {
        n.stop(0);
    }
    catch (e) { } });
}

}

function packPlates(perSide, list) {
    let rem = perSide;
    const out = [];
    for (let i = 0; i < list.length; i++) {
        const p = list[i];
        while (rem >= p - 0.0001) {
            out.push(p);
            rem = Math.round((rem - p) * 1000) / 1000;
        }
    }
    return rem <= 0.0001 ? out : null;
}
// Returns { plates, fine } — fine is true when a 1.25 was required.
function calcPlatesPerSide(totalKg, barKg) {
    if (totalKg == null || isNaN(totalKg))
        return null;
    const num = Number(totalKg);
    const bar = Number(barKg) || 20;
    if (num < bar)
        return null;
    const perSide = Math.round(((num - bar) / 2) * 1000) / 1000;
    if (perSide === 0)
        return { plates: [], fine: false };
    const coarse = packPlates(perSide, GYM_PLATES);
    if (coarse)
        return { plates: coarse, fine: false };
    const fine = packPlates(perSide, GYM_PLATES_FINE);
    if (fine)
        return { plates: fine, fine: true };
    return null;
}

        if (navigator.canShare && window.File) {
            const file = new File([blob], name, { type: "text/csv" });
            if (navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: name });
                return "shared";
            }
        }
    }
    catch (e) {
        if (e && e.name === "AbortError")
            return "cancelled";
    }
    try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
