function normalizeLogs(input) {

    const out = {};
    Object.keys(source).forEach((dayKey) => {
        const m = /^w([1-5])d([1-5])$/.exec(dayKey);
        if (!m) {

            return;

        const w = Number(m[1]), d = Number(m[2]);
        const dayData = PROGRAM.weeks[String(w)] && PROGRAM.weeks[String(w)].days[String(d)];
        if (!dayData) {
            out[dayKey] = source[dayKey];
            return;
        }
        const oldDay = source[dayKey] || {};
        const newDay = {};
        dayData.exercises.forEach((ex, i) => {
            const existing = oldDay[ex.name] || oldDay[i] || oldDay[String(i)];
            if (existing)
                newDay[ex.name] = existing;

        // Preserve unknown string keys in case a future version added metadata.
        Object.keys(oldDay).forEach((k) => {
            if (!/^\d+$/.test(k) && !Object.prototype.hasOwnProperty.call(newDay, k))

let audioCtx = null;
function unlockAudio() {

            return null;
        audioCtx = new AC();
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);

// Schedules three tones at a precise future time. Returns oscillators so the
// chime can be cancelled if the timer is paused or dismissed early.
function scheduleChime(delaySec) {
    const ctx = audioCtx;
    if (!ctx)
        return null;
    try {
        if (ctx.state === "suspended")
            ctx.resume();
        const base = ctx.currentTime + Math.max(0, delaySec);
        const nodes = [];
        const tones = [880, 880, 1174.7];
        for (let i = 0; i < tones.length; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = tones[i];
            const t = base + i * 0.26;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.55, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + (i === 2 ? 0.5 : 0.2));
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + (i === 2 ? 0.55 : 0.24));
            nodes.push(osc);
        }
        return nodes;
    }
    catch (e) {
        return null;
    }
}
function cancelChime(nodes) {
    if (!nodes)

function packPlates(perSide, list) {
    let rem = perSide;
    const out = [];
    for (let i = 0; i < list.length; i++) {
        const p = list[i];
        while (rem >= p - 0.0001) {
            out.push(p);
            rem = Math.round((rem - p) * 1000) / 1000;
        }
    }
    return rem <= 0.0001 ? out : null;
}

function calcPlatesPerSide(totalKg, barKg) {
    if (totalKg == null || isNaN(totalKg))
        return null;
    const num = Number(totalKg);
    const bar = Number(barKg) || 20;
    if (num < bar)
        return null;
    const perSide = Math.round(((num - bar) / 2) * 1000) / 1000;
    if (perSide === 0)
        return { plates: [], fine: false };
    const coarse = packPlates(perSide, GYM_PLATES);
    if (coarse)
        return { plates: coarse, fine: false };
    const fine = packPlates(perSide, GYM_PLATES_FINE);
    if (fine)
        return { plates: fine, fine: true };
    return null;
}

    const lo = Math.round((bar + 2 * Math.floor(perSide / 2.5) * 2.5) * 100) / 100;

    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function loadLabel(ex) {
    const w = ex.weight_kg;
    if (ex.load === "added")
        return w > 0 ? "BW +" + w + " kg" : "Bodyweight";
    if (ex.load === "db")
        return w + " kg/DB";
    if (ex.load === "cable")
        return w + " kg pin";
    return w + " kg";
}
function defSets(ex) {
    const arr = [];
    for (let i = 0; i < ex.sets; i++) {
        arr.push({ w: String(ex.weight_kg), r: "", d: false, t: null });
    }
    return arr;
}
// Epley 1RM: w * (1 + reps/30)
function epley(w, r) {
    const wn = parseFloat(w);
    const rn = parseInt(r, 10);
    if (!wn || !rn || rn < 1)
        return null;
    return Math.round(wn * (1 + rn / 30) * 10) / 10;
}
function dayStats(logs, w, d) {
    const dd = PROGRAM.weeks[String(w)].days[String(d)];
    const dl = logs["w" + w + "d" + d] || {};
    let total = 0, done = 0;
    for (let i = 0; i < dd.exercises.length; i++) {
        const ex = dd.exercises[i];
        total += ex.sets;
        const eLog = dl[ex.name] || dl[i] || dl[String(i)];
        done += (((eLog && eLog.sets) || []).filter((s) => s.d)).length;
    }
    return { total: total, done: done };
}
// Always return the earliest unfinished REQUIRED workout. Optional Day 5 can be resumed
// once started, but it can never push the app into the next week while Days 1-4 are unfinished.
function resolveStartDay(logs) {
    for (let w = 1; w <= 5; w++) {
        for (let d = 1; d <= 4; d++) {
            const st = dayStats(logs, w, d);
            if (st.done < st.total)
                return { week: w, day: d };
        }
        const bonus = dayStats(logs, w, BONUS_DAY);
        if (bonus.done > 0 && bonus.done < bonus.total)
            return { week: w, day: BONUS_DAY };
    }
    return { week: 5, day: 4 };
}
// Bonus day only counts toward the week once it has been started.
function weekStats(logs, w) {
    let total = 0, done = 0;
    for (let d = 1; d <= 5; d++) {
        const st = dayStats(logs, w, d);
        if (d === BONUS_DAY && st.done === 0)
            continue;
        total += st.total;
        done += st.done;
    }
    return { total: total, done: done };
}
// Find the most recent prior log of an exercise by name.
function findLastSession(logs, curW, curD, exerciseName) {
    for (let w = curW; w >= 1; w--) {
        const dStart = w === curW ? curD - 1 : 5;
        for (let d = dStart; d >= 1; d--) {
            const key = "w" + w + "d" + d;
            const log = logs[key];
            if (!log)
                continue;
            const dayData = PROGRAM.weeks[String(w)] && PROGRAM.weeks[String(w)].days[String(d)];
            if (!dayData)
                continue;
            for (let i = 0; i < dayData.exercises.length; i++) {
                const ex = dayData.exercises[i];
                if (ex.name !== exerciseName)
                    continue;
                const eLog = log[ex.name] || log[i] || log[String(i)];
                if (eLog && eLog.sets) {
                    const completedSets = eLog.sets.filter((s) => s.d && String(s.r || "").trim());
                    if (completedSets.length > 0)
                        return { week: w, day: d, completedSets: completedSets };
                }
            }
        }
    }
    return null;
}
// ============ CSV EXPORT ============
function csvCell(v) {
    const s = v === null || v === undefined ? "" : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
}
function isoDay(ms) {
    if (!ms)
        return "";
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function isoTime(ms) {
    if (!ms)
        return "";
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, "0");
    return isoDay(ms) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function buildCSV(logs, adjustments) {
    const head = [
        "week", "week_title", "day", "day_name", "date", "exercise",
        "set_no", "prog_weight_kg", "prog_sets", "prog_reps", "prog_rir",
        "actual_weight_kg", "actual_reps", "completed", "completed_at",
        "weight_delta", "reps_delta", "est_1rm", "load_type", "exercise_note"
    ];
    const rows = [head.map(csvCell).join(",")];
    for (let w = 1; w <= 5; w++) {
        const wk = PROGRAM.weeks[String(w)];
        for (let d = 1; d <= 5; d++) {
            const dd = wk.days[String(d)];
            const dl = logs["w" + w + "d" + d] || {};
            // Export any day the user touched, even if no set has been checked off yet.
            if (Object.keys(dl).length === 0)
                continue;
            let dayMs = null;
            Object.keys(dl).forEach((k) => {
                ((dl[k] && dl[k].sets) || []).forEach((set) => {
                    if (set.d && set.t && (dayMs === null || set.t < dayMs))
                        dayMs = set.t;
                });
            });
            for (let i = 0; i < dd.exercises.length; i++) {
                const rawEx = dd.exercises[i];
                const ex = effectiveExercise(rawEx, d, adjustments);
                const eLog = dl[rawEx.name] || dl[i] || dl[String(i)] || {};
                // Don't manufacture untouched exercise rows just because another exercise on the day was logged.
                if (!eLog.sets && !String(eLog.note || "").trim())
                    continue;
                const sets = eLog.sets || defSets(ex);
                const programmedRepsNumeric = /^\s*\d+(?:\.\d+)?\s*$/.test(String(ex.reps)) ? Number(ex.reps) : null;
                for (let si = 0; si < sets.length; si++) {
                    const set = sets[si];
                    const aw = Number(set.w);
                    const repsText = String(set.r == null ? "" : set.r).trim();
                    const actualRepsNumeric = /^\d+$/.test(repsText) ? Number(repsText) : null;
                    const weightValid = set.w !== "" && Number.isFinite(aw);
                    const wDelta = weightValid ? Math.round((aw - ex.weight_kg) * 100) / 100 : "";
                    const rDelta = actualRepsNumeric !== null && programmedRepsNumeric !== null
                        ? actualRepsNumeric - programmedRepsNumeric : "";
                    rows.push([
                        w, wk.title, d, dd.name, isoDay(dayMs), rawEx.name,
                        si + 1, ex.weight_kg, ex.sets, ex.reps, ex.rpe,
                        weightValid ? aw : set.w, repsText,
                        set.d ? "yes" : "no", isoTime(set.t),
                        wDelta, rDelta,
                        ex.load === "bar" && actualRepsNumeric !== null ? (epley(set.w, repsText) || "") : "",
                        ex.load || "", eLog.note || ""
                    ].map(csvCell).join(","));
                }
            }
        }
    }
    return rows.join("\r\n");
}
async function exportCSV(logs, adjustments) {
    const csv = buildCSV(logs, adjustments);
    if (csv.split("\r\n").length < 2)
        return "empty";
    const name = "vtaper_" + isoDay(Date.now()) + ".csv";
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    try {
        if (navigator.canShare && window.File) {
            const file = new File([blob], name, { type: "text/csv" });
            if (navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: name });
                return "shared";
            }
        }
    }
    catch (e) {
        if (e && e.name === "AbortError")
            return "cancelled";
    }
    try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
        return "downloaded";
    }
    catch (e) { }
    try {
        await navigator.clipboard.writeText(csv);
        return "copied";
    }
    catch (e) { }
    return "failed";
}
